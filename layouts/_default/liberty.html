<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幣圈宅 TECH COINS CRYPTO | 自由女神銀幣</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/d-din');
        body, h1, h2, h3, p, a, span, div {
            font-family: 'D-DIN', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            color: #e4e4e7 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        h1, [class*="tracking-widest"] { text-transform: uppercase; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
        .logo-size-mobile { height: 44px !important; width: 44px !important; }
        @media (min-width: 640px) {
            .logo-size-desktop { height: 56px !important; width: 56px !important; }
        }
    </style>
</head>
<body class="bg-black text-zinc-200 antialiased flex flex-col min-h-screen">
    <nav class="border-b border-zinc-900 bg-black/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center relative h-16">
            <a href="/" class="hover:opacity-90 transition flex items-center select-none relative h-full">
                <div class="relative flex items-center justify-center">
                    <img src="/images/logo.png" alt="Tech Coins Crypto Logo" class="logo-size-mobile logo-size-desktop object-contain rounded-full bg-black shadow-[0_4px_20px_rgba(0,0,0,0.9)] border border-zinc-900/50">
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-0.5 sm:gap-2 ml-3.5">
                    <span class="font-bold text-xl sm:text-2xl tracking-wide text-zinc-200 line-clamp-1 leading-none">幣圈宅</span>
                    <span class="text-zinc-500 font-medium text-xs sm:text-sm sm:border-l sm:border-zinc-800 sm:pl-2 hidden sm:inline leading-none">找到屬於自己的精緻幣</span>
                </div>
            </a>
            <div class="flex space-x-3 sm:space-x-6 text-[10px] md:text-xs font-bold tracking-widest items-center">
                <a href="https://www.ruten.com.tw/store/wmpkimo/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition py-1 text-zinc-200 border-b border-zinc-700 hover:border-zinc-400 whitespace-nowrap">美國創新[查看庫存]</a>
                <a href="/eagle/" class="hover:text-white transition py-1 text-zinc-200 border-b border-zinc-700 hover:border-zinc-400 whitespace-nowrap">美國鷹揚</a>
                <a href="/liberty/" class="hover:text-white transition py-1 text-white border-b border-white whitespace-nowrap">自由女神</a>
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="border-b border-zinc-900 pb-6">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-zinc-200 leading-tight uppercase">自由女神銀幣<br><span class="text-2xl md:text-3xl block mt-1.5 text-zinc-500 font-normal tracking-wide uppercase">American Liberty</span></h1>
        </div>
        <div id="liberty-content" class="space-y-16">
        </div>
    </main>
    <footer class="border-t border-zinc-900 py-8 text-center text-zinc-600 text-xs">
        <p>幣圈宅 TECH COINS CRYPTO</p>
    </footer>
    <script>
        fetch('/data/liberty-coins.json').then(r => r.json()).then(coins => {
            const container = document.getElementById('liberty-content');
            if (!coins.length) {
                container.innerHTML = '<p class="text-center text-zinc-600">照片準備中，敬請期待</p>';
                return;
            }
            container.innerHTML = coins.map(c => {
                var coinBox = function(src) {
                    return '<div class="relative w-72 aspect-square sm:w-80 sm:aspect-square md:w-96 md:aspect-square rounded-full bg-zinc-950/40 border border-zinc-900/60 flex items-center justify-center overflow-hidden shadow-[inset_-25px_0px_50px_rgba(0,0,0,1),0_15px_40px_rgba(0,0,0,0.85)]">' +
                        '<img src="/images/liberty/' + src + '" loading="lazy" class="w-[92%] h-[92%] object-cover rounded-full">' +
                        '</div>';
                };
                var imgs = '<div class="flex flex-row justify-center items-center gap-8 md:gap-12 w-full">' +
                    coinBox(c.img) +
                    (c.img_rev ? coinBox(c.img_rev) : '') +
                    '</div>';
                return '<div class="grid grid-cols-1 md:grid-cols-12 gap-12 items-start">' +
                    '<div class="md:col-span-7 flex flex-col justify-between min-h-full">' +
                    '<article class="space-y-6 text-zinc-300 leading-relaxed tracking-wide text-base md:text-lg py-2 font-medium">' +
                    '<p class="font-medium text-zinc-200 text-xl border-l-2 border-zinc-200 pl-3 font-sans mb-6 mt-0 leading-relaxed tracking-wide">' + c.title + '</p>' +
                    '<p class="font-medium text-zinc-400 text-xl border-l-2 border-zinc-700 pl-3 font-sans mb-6 mt-0 leading-relaxed tracking-wide">目前沒空寫這枚介紹。有靈感或是入手此幣，就會開始寫啦！</p>' +
                    '</article></div>' +
                    '<div class="md:col-span-5 flex flex-col space-y-6 items-center select-none py-2">' + imgs + '</div>' +
                    '</div>';
            }).join('');
        }).catch(() => {
            document.getElementById('liberty-content').innerHTML = '<p class="text-center text-zinc-600">照片準備中，敬請期待</p>';
        });
    </script>
</body>
</html>
